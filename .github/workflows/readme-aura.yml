name: Generate Profile
on:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 * * * *' # Hourly refresh for live GitHub metrics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate individual aura components
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.METRICTOKEN || github.token }}

      - name: Generate unified profile SVG
        env:
          GITHUB_TOKEN: ${{ secrets.METRICTOKEN || github.token }}
          GITHUB_USER: Thato-Motseki
        run: node .github/scripts/generate-profile.js --production

      - name: Set README to single profile SVG
        run: |
          printf '<p align="center">\n  <img src="https://komarev.com/ghpvc/?username=Thato-Motseki&label=Profile%%20views&color=ff6f91&style=flat" alt="T.Motseki" />\n</p>\n\n![T.Motseki Profile](./.github/assets/profile.svg)\n' > README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force .github/assets README.md
          git diff --staged --quiet || (git commit -m "chore: update profile" && git push)
