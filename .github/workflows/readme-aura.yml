name: Generate Profile
on:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 * * * *' # Hourly refresh for live GitHub metrics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate individual aura components
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.METRICTOKEN }}

      - name: Generate unified profile SVG
        env:
          GITHUB_TOKEN: ${{ secrets.METRICTOKEN }}
          GITHUB_USER: Thato-Motseki
        run: node .github/scripts/generate-profile.js

      - name: Set README to single profile SVG
        run: |
          printf '<p align="center">\n  <img src="https://komarev.com/ghpvc/?username=Thato-Motseki&label=Profile%%20views&color=ff6f91&style=flat" alt="T.Motseki" />\n</p>\n\n<table width="100%%">\n  <tr>\n    <td width="190" align="center" valign="middle">\n      <img src="./.github/assets/banner.png" width="180" height="180" alt="T.Motseki banner" />\n    </td>\n    <td valign="middle">\n      <h1>T.Motseki</h1>\n      <p><strong>Software Developer</strong><br />Build. Break. Learn. Improve</p>\n      <p><a href="https://github.com/Thato-Motseki">GitHub</a> · <a href="https://www.linkedin.com/in/thato-motseki">LinkedIn</a></p>\n    </td>\n  </tr>\n</table>\n\n![T.Motseki Profile](./.github/assets/profile.svg)\n' > README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force .github/assets README.md
          git diff --staged --quiet || (git commit -m "chore: update profile" && git push)
